# Publishes site/ to GitHub Pages. The site's pictures (logo and screenshots of the original) are not in
# git: the workflow takes them from site-assets.zip on the newest release (tools/release/make_release.sh).
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the site pictures from the newest release
        id: pictures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${{ github.repository }}/releases?per_page=10" --jq '[.[] | select(.draft | not)][0].tag_name')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::notice::No release yet, so the site waits for the first one."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$tag" --repo "${{ github.repository }}" --pattern site-assets.zip --dir "$RUNNER_TEMP"
          mkdir -p site/assets
          unzip -o -q "$RUNNER_TEMP/site-assets.zip" -d site/assets
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.pictures.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pictures.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: steps.pictures.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
